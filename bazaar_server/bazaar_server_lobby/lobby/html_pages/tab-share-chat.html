<html>
<!-- Tab Edits -->
<style>

ul.tab {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    border: 1px solid #ccc;
    background-color: #f1f1f1;
}

/* Float the list items side by side */
ul.tab li {float: left;}

/* Style the links inside the list items */
ul.tab li a {
    display: inline-block;
    color: black;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
    transition: 0.3s;
    font-size: 17px;
}

/* Change background color of links on hover */
ul.tab li a:hover {
    background-color: #ddd;
}

/* Create an active/current tablink class */
ul.tab li a:focus, .active {
    background-color: #ccc;
}

/* Style the tab content */
.tabcontent {
    display: none;
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-top: none;
}

/* Other-participants iframe panel (replaces the old shared-image list).
   Reuses the ul.tab / .tabcontent rules above: tabs run along the top,
   and only the selected tab's iframe is shown, giving each page more room. */
.tablinks.tab_empty {
    opacity: 0.5;
    cursor: default;
}

#other_pages_tabs {
    margin-bottom: 0;
}

.other_frame {
    display: block;
    width: 100%;
    height: 480px;
    border: none;
}
</style>
<!-- End of additions for tab edits -->

<script>
    var windowHasFocus = true;

    var entityMap = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
        "/": "&#x2F;",
      };
      
    function escapeHTML(string) {
        return String(string).replace(/[&<>"'\/]/g, function (s) {
          return entityMap[s];
        });
      }
	
    function showConvText()
    {
        res = "";
        conv = document.getElementById("conversation");
        for (var i = 0; i < conv.childNodes.length; i++) {
            if (conv.childNodes[i].className.indexOf("message_line") == -1) continue;
            var user = conv.childNodes[i].getElementsByClassName("user");
            var timestamp = conv.childNodes[i].getElementsByClassName("date");
            var message = conv.childNodes[i].getElementsByClassName("message");
            for (var j = 0; j < user.length; j++) res += user[j].textContent + " ";
            if (timestamp.length > 0) res += "("+timestamp[0].textContent+")";
            if (message.length > 0) res += ": "+message[0].textContent.replace("\n"," ");
            res += "\n";
        }
        document.getElementById("conversation_text").value = res;

        // Highlight
        if (document.body.createTextRange) {
            range = document.body.createTextRange();
            range.moveToElementText(document.getElementById("conversation_text"));
            range.select();
        } else if (window.getSelection) {
            selection = window.getSelection();        
            range = document.createRange();
            range.selectNodeContents(document.getElementById("conversation_text"));
            selection.removeAllRanges();
            selection.addRange(range);
        }

        document.getElementById("conversation_text_div").style.display = "block";
    }

        $('.sortable').sortable();

    function getMultimodalValue(field, data) 
    {
    	var fields = data.split(";%;");
    	var numFields = fields.length; 	
		console.log("getMultimodalValue - search field: " + field);   		
		console.log("getMultimodalValue - data: " + data);   	
		console.log("getMultimodalValue - numFields: " + numFields.toString());
    	var i = 0; 
    	var value = ""; 
    	while (i < numFields) {
    		var fieldWithValue = fields[i].split(":::");   
			console.log("getMultimodalValue - fieldWithValue: " + fieldWithValue);   
    		i =	i + 1; 	
    		if (fieldWithValue[0] == field) {
    			console.log("getMultimodalValue - field found");  
    			value = fieldWithValue[1];
    			console.log("getMultimodalValue - value: " + value);  
    			i = numFields;
    		}
    	}
    	return value;    
    } 

	// var socket = io.connect(chatserver_url, {
    //     path: '/bazaar'
    // });
    const urlParams = new URLSearchParams(location.search);
    // const socketPath =
    const socket = io({
        path: '/bazsocket',
        query: {
          ltik: urlParams.get('ltik')
        }
    });

	var users = {};
	var user = 'You'
	var room = 'Here'
        var id  = 'NA'
        var perspective = '';
        var live_chat = false;
        var temp = false;

        // Portion of location.pathname before the "/chat/.../.../.../" segment
        // (e.g. "/bazaar"), so the Private_N tab URLs are built against
        // whatever prefix this page itself was actually served under.
        // Computed once the "chat"/"observe"/"code" regex match is available
        // (see the 'connect' handler below).
        var pathPrefix = '';

        var NUM_OTHER_FRAMES = 5;

        // The individual pages embedded in the tabs are always
        // private_space.html, regardless of what html= this coordinator page
        // itself was loaded with -- matching LlmCameraListener's default
        // "html-page" property ("private_space"), which is what it points
        // each user's own welcome-message URL at.
        var PRIVATE_TAB_HTML_PAGE = 'private_space';

        // Builds the fixed URL for the Nth (1-based) private tab: same
        // server/path-prefix/room/perspective this coordinator page itself
        // was loaded with, but with both the id and user path segments set to
        // "Private_<n>" -- the exact scheme LlmCameraListener.handlePresenceEvent
        // uses to build each student's own welcome-message URL.
        function buildPrivateTabUrl(n) {
            var privateName = 'Private_' + n;
            var path = pathPrefix + '/chat/' + encodeURIComponent(room) + '/' + privateName + '/' + privateName +
                '/' + encodeURIComponent(perspective) + '/';
            return location.origin + path + '?html=' + PRIVATE_TAB_HTML_PAGE;
        }

        // Points all 5 tabs at their Private_1..Private_5 URLs as soon as this
        // page knows its own room/perspective (see the 'connect' handler).
        // Tab labels start as "Private_<n>" and get relabeled with the real
        // userName once LlmCameraListener reports the userNum->userName
        // assignment (see setPrivateTabUserName / the 'tabUserUpdate' tag
        // handled in the update_private_chat listener below).
        function initPrivateTabs() {
            for (var n = 1; n <= NUM_OTHER_FRAMES; n++) {
                var slotIndex = n - 1;
                var frame = document.getElementById('other_frame_' + slotIndex);
                var link = document.getElementById('other_frame_tab_' + slotIndex);
                if (!frame || !link) continue;
                var src = buildPrivateTabUrl(n);
                frame.setAttribute('data-src', src);
                frame.src = src;
                link.textContent = 'Private_' + n;
            }
        }

        // Relabels the tab for userNum (1-based, as a string or number) with
        // userName, once LlmCameraListener assigns that userNum to a real
        // user. No-op if userNum is out of range.
        function setPrivateTabUserName(userNum, userName) {
        		console.log("*** setPrivateTabUserName - enter -- userNum=" + userNum + "  -- userName=" + userName );
            var n = parseInt(userNum, 10);
            if (isNaN(n) || n < 1 || n > NUM_OTHER_FRAMES) return;
        		console.log("setPrivateTabUserName - found good userNum");
            var link = document.getElementById('other_frame_tab_' + (n - 1));
            if (!link) return;
        		console.log("setPrivateTabUserName - found other_frame_tab_n-1");
            link.textContent = userName;
            link.classList.remove('tab_empty');
        		console.log("setPrivateTabUserName - end");
        }

        // Switches tabs: hides every tab's content, un-marks every tab link,
        // then shows the chosen one and marks its link active. Called with no
        // slotIndex (e.g. after the roster changes) it just re-syncs the
        // active/visible tab without changing the selection.
        function openOtherPageTab(evt, slotIndex) {
            var tabcontents = document.getElementsByClassName('tabcontent');
            for (var i = 0; i < tabcontents.length; i++) {
                tabcontents[i].style.display = 'none';
            }
            var tablinks = document.getElementsByClassName('tablinks');
            for (var j = 0; j < tablinks.length; j++) {
                tablinks[j].classList.remove('active');
            }
            if (slotIndex === undefined || slotIndex === null) return;
            var content = document.getElementById('other_frame_slot_' + slotIndex);
            var link = document.getElementById('other_frame_tab_' + slotIndex);
            if (content) content.style.display = 'block';
            if (link) link.classList.add('active');
        }

	// on connection to server, ask for user's name with an anonymous callback
	socket.on('connect', function(){
        // call the server-side function 'adduser' and send one parameter (value of prompt)
	groups = /\/(chat|observe|code)(\/tmp)?(?:\/([^\/]+)?)(?:\/([^\/]*))(?:\/([^\/]*))(?:\/([^\/]*))?/.exec(location.pathname);
        pathPrefix = location.pathname.substring(0, groups.index);

        live_chat = groups[1] == "chat";
		  
        if(live_chat)
        {
            temp = groups[2] && groups[2].length > 0;
            room = groups[3];
            user = groups[5];
            id = groups[4];
            perspective = groups[6];
            initPrivateTabs();
            if(!user)
                user = prompt("Hi! please enter your name (first name and last initial) to continue..", "");
            //prompt(room + " " + user + " " + temp + " " + id);
            socket.emit('adduser', room, user, false, id, perspective);
        }
        else
	{
            socket.emit('snoop', room, id);
            $('input,textarea').prop('disabled', true);
	}
        $('#roomname').text(room); 
        });
	

	// listener, whenever the server emits 'updatechat', this updates the chat body
	socket.on('updatechat', function (username, data)
	{
		if (data.search("multimodal:::true;%;") > -1) {
// 			console.log("updatechat - multimodal message found");
			username = getMultimodalValue("from",data);
			data = getMultimodalValue("speech",data);
			// An empty "speech" value means this multimodal message carries
			// no chat text of its own (e.g. it's purely a tagged payload for
			// some other field, like tabUserUpdate) -- nothing to display.
			if (!data) return;
		} else {
// 			console.log("updatechat - multimodal message NOT found");
		}
// 		console.log("updatechat - username: " + username);
// 		console.log("updatechat - data:     " + data);
        appendMessage(new Date(), username, data);
		$('#conversation').stop().animate({ scrollTop: $("#conversation")[0].scrollHeight}, 500);
	});
	
    // listener, whenever the server emits 'updateimage', this updates the image list
	socket.on('updatehtml', function (username, html) 
	{
        anchor = appendHTML(new Date(), username, html);
        appendNote(new Date(), username, 'has shared an <a href="#'+anchor+'">item.</a>');
		$('#images').stop().animate({ scrollTop: $("#images")[0].scrollHeight}, 500);	
	});
	
	
    // listener, whenever the server emits 'updateimage', this updates the image list
	socket.on('updateimage', function (username, image_url) 
	{
        anchor = appendImage(new Date(), username, image_url);
        appendNote(new Date(), username, 'has shared an <a href="#'+anchor+'">image/URL.</a>');
		$('#images').stop().animate({ scrollTop: $("#images")[0].scrollHeight}, 500);	
	});
	
	socket.on('dump_history', function (backlog) 
	{
	    for(i = 0; i < backlog.length; i++)
	    {
	       entry = backlog[i];
	       stamp = new Date(entry["timestamp"]);
               if(stamp < lastDate)
			  continue;
	       if(entry["type"] == "image")
	       {
                anchor = appendImage(new Date(entry["timestamp"]), entry["username"], entry["content"]);	
                appendNote(new Date(entry["timestamp"]), entry["username"], 'has shared an <a href="#'+anchor+'">image/URL.</a>');
            }
	       else if(entry["type"] == "html")
	       {
                anchor = appendHTML(new Date(entry["timestamp"]), entry["username"], entry["content"]);	
                appendNote(new Date(entry["timestamp"]), entry["username"], 'has shared an <a href="#'+anchor+'">item.</a>');
            }
            else if(entry.type == "presence")
                appendNote(new Date(entry.timestamp), entry.username,  (entry.content == "leave"? " has disconnected." : " has joined the discussion."));	 
            else if(entry.type == "ready")
                    ;
                    //appendNote(new Date(entry.timestamp), entry.username, (entry.content == "ready")?"thinks the team is ready.":"isn't ready yet.");
            else if(entry.type == "private")
                appendMessage(new Date(entry["timestamp"]), entry.username+" (Private Message)", entry["content"], getUserColor(entry.username));	 	 
            else
                appendMessage(new Date(entry["timestamp"]), entry.username, entry["content"]);	 
        }

		$('#conversation').stop().animate({ scrollTop: $("#conversation")[0].scrollHeight}, 500);
        $('#images').stop().animate({ scrollTop: $("#images")[0].scrollHeight}, 500);

			   lastDate = new Date();
	});
	
	    // listener, whenever the server emits 'updaterooms', this updates the room list
	socket.on('updaterooms', function (rooms, my_room) 
	{
		$('#roomname').text(my_room);
	});
	
		    // listener, whenever the server emits 'updateimage', this updates the user list
	socket.on('updateusers', function (my_users)
	{
	   users = my_users;
	   console.log(users);
	});
	


	    // listener, whenever the server emits 'updatepresence', this updates the image list
	socket.on('updatepresence', function (username, data) 
	{
		if (data.search("multimodal:::true;%;") > -1) {
// 			console.log("// updatepresence - multimodal message found - username: " + username + "   data: " + data);
			username = getMultimodalValue("from",data);
			data = getMultimodalValue("presence",data);
		} else {
// 			console.log("updatechat - multimodal message NOT found");
		}
// 		console.log("updatepresence, username after processing: " + username);
// 		console.log("updatepresence: data after processing:     " + data);
		appendNote(new Date(), username,  (data == "leave"? " has disconnected." : " has joined the discussion."));	
		$('#conversation').stop().animate({ scrollTop: $("#conversation")[0].scrollHeight}, 500);
	});
	
    // listen for other user's ready events. We'll leave this off for now.
	/*socket.on('updateready', function (username, ready_state) 
	{
        appendNote(new Date(), username, (ready_state == "ready")?"thinks the team is ready.":"isn't ready yet.");
		$('#images').stop().animate({ scrollTop: $("#images")[0].scrollHeight}, 500);	
	});*/
	
    // listener, whenever the server emits 'updatechat', this updates the chat body
	socket.on('update_global_ready', function (ready_state) 
	{
	   if(ready_state == 'unready')
	   {
            $('#ready_button').removeClass("toggled");
           }
	});
	
	// listener, whenever the server emits 'update_private_chat', this updates the chat body
	// NOTE: the server (server_lobby_https.js, socket.on('sendpm')) emits this event
	// with 3 args: (to_user, from_user, data) -- matching private_space.html's
	// established handler signature. Keep this handler's arity in sync with that.
	socket.on('update_private_chat', function (touser, fromuser, data)
	{
		// LlmCameraListener sends this tag (see sendTabShareUserUpdate) the
		// moment it assigns a userNum to a real userName, targeted at this
		// page's own username. Intercept it here and relabel the matching
		// tab instead of appending it as a chat line.
		console.log("*** update_private_chat -- enter");
		if (data.search("tabUserUpdate:::true;%;") > -1) {
			console.log("update_private_chat -- found tabUserUpdate");
			var updateUserNum = getMultimodalValue("userNum", data);
			var updateUserName = getMultimodalValue("userName", data);
			console.log("update_private_chat, calling setPrivateTabUserName -- updateUserNum=" + updateUserNum + "  -- updateUserName=" + updateUserName);
			setPrivateTabUserName(updateUserNum, updateUserName);
			return;
		}
		if (data.search("multimodal:::true;%;") > -1) {
			console.log("update_private_chat - multimodal message found");
			fromuser = getMultimodalValue("from",data);
			touser = getMultimodalValue("to",data);
			data = getMultimodalValue("speech",data);
			// An empty "speech" value means this multimodal message carries
			// no chat text of its own (e.g. it's purely a tagged payload for
			// some other field) -- nothing to display. (The tabUserUpdate
			// case above already returns before reaching here; this is a
			// defensive fallback for any other empty-speech message.)
			if (!data) return;
		} else {
			console.log("update_private_chat - multimodal message NOT found");
		}
		console.log("update_private_chat - touser: " + touser);
		console.log("update_private_chat - fromuser: " + fromuser);
		console.log("update_private_chat - data:     " + data);

//         appendMessage(new Date(), fromuser+' (Private Message)', data, getUserColor(fromuser));
        appendMessage(new Date(), fromuser, data);

		$('#conversation').stop().animate({ scrollTop: $("#conversation")[0].scrollHeight}, 500);
	});
	
	
	function switchRoom(room)
	{
		socket.emit('switchRoom', room);
	}

    function sendReady(is_ready)
    {
        socket.emit('ready', is_ready?'ready':'unready'); //'ready' or 'unready'         
    }
    
    function sendMessage()
    {
            var message = $('#data').val();
			//$('#data').val('');
			// tell server to execute 'sendchat' and send along one parameter
			
			$('#data').val('');
			
			message = escapeHTML(message)
			
			if(message && message.length > 0)
			{
    			socket.emit('sendchat', message);
		        $('#conversation').stop().animate({ scrollTop: $("#conversation")[0].scrollHeight}, 500);
		}
    }

	// on load of page
	$(document).ready(function(){
		// when the client clicks SEND
		$('#datasend').click( function() 
		{
            sendMessage();
		});
		
		
		// when the client clicks READY
		$('#ready_button').click( function() 
		{
            $('#ready_button').toggleClass("toggled");
            sendReady($('#ready_button').hasClass("toggled"));
            //appendNote(new Date(), "You", "think we're ready.", getUserColor(user)); 
		});

		// when the client hits ENTER on their keyboard
		$('#data').keypress(function(e) {
			if(e.which == 13 && !(e.altKey || e.shiftKey)) 
			{
				e.preventDefault();
				sendMessage();
			}
		});
		
	});
	
    $(window).focus(function() 
    {

        windowHasFocus = true;
        unreadMessages = 0;
        updateTitle();
    });
  
    //listen for browser events so we know to update the document title
    $(window).blur(function() 
    {

        windowHasFocus = false;
        updateTitle();
    });

    //we want to show a count of unread messages when the window does not have focus
    function updateTitle()
    {
      if (unreadMessages) 
      {
        document.title = "(" + unreadMessages.toString() + ") Discussion Room "+room;
      }
      else 
      {
        document.title = "Discussion Room "+room;
      }
    }
    
    function noticeNewMessage()
    {


	if(!windowHasFocus)
        {
            unreadMessages++;
	    
            updateTitle();
        }
    }

    function blinker() {
        $('.blinker').fadeIn(2000);
        setTimeout(function() {$('.blinker').fadeOut(2000);}, 10000);
    }
    setInterval(blinker,30000);

</script>
