# Two ways to put Etherpad on the same registrable domain as your Java
# agent's web app, so the sessionID cookie set by pad-chat.html.template is
# visible to both. Pick ONE. See README "Cross-origin cookie gotcha" for why
# this matters.

# ---------------------------------------------------------------------------
# OPTION A (recommended): Etherpad on its own subdomain.
# Simplest -- Etherpad runs at its normal root path, no path-rewriting.
# Cookie is set with `Domain=.yourapp.com` so it's shared across subdomains.
#
# server { listen 443 ssl; server_name pad.yourapp.com; ... }
server {
    listen 443 ssl;
    server_name pad.yourapp.com;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Etherpad's realtime editing runs over Socket.IO.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------------------------------------------------------------------------
# OPTION B (advanced): Etherpad under a sub-path of the SAME host as the
# agent app (e.g. https://agent.yourapp.com/pad/). Etherpad's sub-path
# reverse-proxy support is less battle-tested than a dedicated subdomain --
# confirm static assets (/pad/static/..., /pad/socket.io/...) load correctly
# before relying on this in production. Include inside the agent app's
# existing `server { ... }` block.
#
# location /pad/ {
#     proxy_pass http://127.0.0.1:9001/;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_http_version 1.1;
#     proxy_set_header Upgrade $http_upgrade;
#     proxy_set_header Connection "upgrade";
# }