openai.api.key=
llama2.api.key=

model=openai
name=DocBot
openai.request.url=https://api.openai.com/v1/chat/completions
openai.model.name=gpt-5.5
openai.temperature=1
openai.context.length=10
openai.context.flag=true
openai.prompt.context="Check the grammar of every complete sentence in the text that you have not already checked. A complete sentence is defined as a string one or more words without a line break ending with a period, question mark, or exclamation mark. Provide a list of all sentences that you have not previously checked that contain grammar errors.  Do not report an error more than once. For each sentence with an unreported error, provide a corrected version of the sentence.  If there are no grammar errors that have not already been reported, respond with 'No grammar errors found.'"
openai.prompt.context2="Check every string in the text for grammar. If any grammar is incorrect, return a string of all the original text (including whitespace) with only the incorrect grammar fixed. If all of the grammar is correct, return only the string 'Grammar looks okay.'"
openai.prompt.context2.corrected="Grammar errors have been fixed."
openai.prompt.context2.not-corrected="Grammar looks okay."
# openai.prompt.context2.OLD="Check every string in the text for grammar. If any grammar is incorrect, return the string 'Grammar errors have been fixed.' followed immediately by all of the original text (including whitespace) with only the incorrect grammar fixed. If all of the grammar is correct, return only the string 'Grammar looks okay.'"